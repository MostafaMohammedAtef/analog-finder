name: Check contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JSON files match CONTRACTS.md
        run: python scripts/check_contracts.py
      - name: No large files committed
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -maxdepth 0 -size +5M 2>/dev/null)
          if [ -n "$big" ]; then echo "Files over 5 MB (do not commit DEMs):"; echo "$big"; exit 1; fi
