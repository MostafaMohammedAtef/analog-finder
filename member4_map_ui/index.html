<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: sans-serif; }
    #controls { padding: 10px; background: #f4f4f4; }
    #map { height: calc(100vh - 100px); }
    label { margin-right: 12px; }
    input[type="range"] { width: 90px; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="controls">
    <label>Target:
      <select id="target">
        <option value="jezero">Jezero</option>
        <option value="shackleton_rim">Shackleton Rim</option>
      </select>
    </label>
    <span id="sliders"></span>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>
  <script>
    const features = ["slope_deg", "temp_range_k", "ndvi", "precip_mm_yr", "dust_idx"];
    const map = L.map("map").setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    let rows = [];
    let markers = L.layerGroup().addTo(map);
    const sliders = document.getElementById("sliders");

    features.forEach(feature => {
      const label = document.createElement("label");
      label.innerHTML = `${feature} <input data-feature="${feature}" type="range" min="0" max="2" step="0.1" value="1"> <output>1.0</output>`;
      const input = label.querySelector("input");
      input.addEventListener("input", () => {
        label.querySelector("output").value = input.value;
        render();
      });
      sliders.appendChild(label);
    });

    function color(score) {
      const hue = Math.round(score * 120);
      return `hsl(${hue}, 80%, 40%)`;
    }
    function render() {
      markers.clearLayers();
      const weights = Object.fromEntries([...document.querySelectorAll("input[data-feature]")].map(input => [input.dataset.feature, Number(input.value)]));
      rows.forEach(row => {
        const sims = features.map(feature => Number(row[`sim_${feature}`]));
        const total = features.reduce((sum, feature, index) => sum + sims[index] * weights[feature], 0);
        const denominator = features.reduce((sum, feature) => sum + weights[feature], 0);
        const score = denominator ? total / denominator : 0;
        L.circleMarker([row.lat, row.lon], {
          radius: 5, color: color(score), fillColor: color(score), fillOpacity: 0.75
        }).bindPopup(`<b>${row.cell_id}</b><br>Score: ${score.toFixed(3)}<br>${features.map((feature, index) => `${feature}: ${sims[index].toFixed(3)}`).join("<br>")}`).addTo(markers);
      });
    }
    function loadTarget(target) {
      Papa.parse(`../out/scores_${target}.csv`, {
        download: true, header: true, dynamicTyping: true,
        complete: result => { rows = result.data.filter(row => row.cell_id); render(); },
        error: error => alert(`Could not load scores: ${error.message}`)
      });
    }
    document.getElementById("target").addEventListener("change", event => loadTarget(event.target.value));
    loadTarget("jezero");
  </script>
</body>
</html>
